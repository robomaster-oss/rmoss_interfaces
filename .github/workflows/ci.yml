name: Build and Test
on:
  push:
    branches: [ jazzy ]
  pull_request:
    branches: [ jazzy ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Build rmoss_interfaces
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy